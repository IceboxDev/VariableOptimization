version: "3"

dotenv: [".env"]

env:
  GOOGLE_APPLICATION_CREDENTIALS: ".config/personal-433622-62e046c7be64.json"

tasks:
  sync:
    desc: Install/update the virtual environment.
    cmds:
      - uv sync

  test:
    desc: Run the test suite.
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  train:
    desc: Tracked training run (task train BEST_OF=100 SEED=42 NOTE="why this run").
    cmds:
      - >
        uv run vopt train
        --best-of {{.BEST_OF | default "100"}}
        {{if .SEED}}--seed {{.SEED}}{{end}}
        {{if .WORKERS}}--workers {{.WORKERS}}{{end}}
        {{if .EPOCHS}}--epochs {{.EPOCHS}}{{end}}
        {{if .NOTE}}--note "{{.NOTE}}"{{end}}
        {{if .SUFFIX}}--suffix "{{.SUFFIX}}"{{end}}
        {{.CLI_ARGS}}

  preview:
    desc: Pretty-print all games by year (task preview MODEL=deployed adds predictions).
    cmds:
      - >
        uv run vopt preview
        {{if .MODEL}}--model "{{.MODEL}}"{{end}}
        {{.CLI_ARGS}}

  eval:
    desc: Rank players by predicted team scores (task eval MIN_GAMES=3 YEAR=2025).
    cmds:
      - >
        uv run vopt eval
        --model "{{.MODEL | default "deployed"}}"
        {{if .MIN_GAMES}}--min-games {{.MIN_GAMES}}{{end}}
        {{if .YEAR}}--year {{.YEAR}}{{end}}
        {{.CLI_ARGS}}

  rank:
    desc: Derive player strengths from a model; dry-run by default (task rank -- --write).
    cmds:
      - >
        uv run vopt rank
        --model "{{.MODEL | default "deployed"}}"
        {{if .SAMPLES}}--samples {{.SAMPLES}}{{end}}
        {{if .SEED}}--seed {{.SEED}}{{end}}
        {{.CLI_ARGS}}

  anomalies:
    desc: Detect statistical outliers; dry-run by default (task anomalies -- --write).
    cmds:
      - >
        uv run vopt mark-anomalies
        --model "{{.MODEL | default "deployed"}}"
        {{if .THRESHOLD}}--threshold {{.THRESHOLD}}{{end}}
        {{.CLI_ARGS}}

  changelog:
    desc: Show the newest training changelog entries.
    cmds:
      - head -n 40 output/CHANGELOG.md

  refresh:
    desc: Force-refresh the snapshot cache from Google Sheets.
    cmds:
      - uv run vopt refresh

  clean:
    desc: Remove the snapshot cache.
    cmds:
      - rm -rf .cache

  clean-output:
    desc: DESTRUCTIVE — remove all runs, the deployed model, and the changelog.
    prompt: This deletes output/ including CHANGELOG.md and the deployed model. Continue?
    cmds:
      - rm -rf output

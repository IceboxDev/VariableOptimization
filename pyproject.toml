[project]
name = "variableoptimization"
version = "1.0.0"
description = "Pub-quiz score prediction: Google Sheets / xlsx data pipeline and neural-network training"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gspread>=6.2.1",
    "matplotlib>=3.10.7",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "rich>=14.2.0",
    "scipy>=1.14",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[project.scripts]
vopt = "variableoptimization.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/variableoptimization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
